services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: auth_service
      POSTGRES_USER: auth_service
      POSTGRES_PASSWORD: auth_service
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth_service -d auth_service"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/auth_service
      SPRING_DATASOURCE_USERNAME: auth_service
      SPRING_DATASOURCE_PASSWORD: auth_service
    ports:
      - "8080:8080"

  # Formatter/linter only — not part of the running app.
  # Usage:
  #   docker compose run --rm tools mvn spotless:apply
  #   docker compose run --rm tools mvn checkstyle:check
  tools:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    volumes:
      - .:/app
      - maven_repo:/root/.m2
    working_dir: /app
    entrypoint: ["mvn"]
    profiles:
      - tools

volumes:
  postgres_data:
  maven_repo:
