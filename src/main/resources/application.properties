# Authentication Service
spring.application.name=authentication-service
# Server port
server.port=${PORT:8080}

# Spring Boot Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Database connection
spring.datasource.url=${DB_URL:jdbc:postgresql://db:5432/auth_service}
spring.datasource.username=${DB_USERNAME:auth_service}
spring.datasource.password=${DB_PASSWORD:auth_service}

# Flyway owns the schema; Hibernate only checks entities match it, never alters it.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.table=flyway_schema_history
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.baseline-version=0